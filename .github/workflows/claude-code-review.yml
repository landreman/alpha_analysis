name: Claude Code Review

on:
  pull_request:
    # Deliberately excludes "opened" (fires even for draft PRs) and "synchronize"
    # (fires on every push). Open PRs as draft and call `gh pr ready` only when a
    # review pass is actually wanted; see .agents/skills/milestone/SKILL.md.
    types: [ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install review verification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read .claude/commands/review-milestone.md and perform its adversarial
            milestone review against this pull request. Use the checked-out PR code and
            its base branch as the review target.

            The guiding document is docs/DESIGN.md; docs/STATUS.md tracks milestone
            completion and docs/adr/ holds accepted deviations.

            Post a top-level GitHub PR comment containing the required findings table
            and final merge verdict, even when there are no findings. Add confirmed
            inline comments for code-specific findings only.
          claude_args: |
            --model opus
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(make*),Bash(pytest*),Bash(python*),Bash(black*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
