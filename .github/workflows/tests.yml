name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install black
        run: python -m pip install black

      - name: Check formatting
        run: black --check --diff alpha_analysis test

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Gmsh runtime library
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # Fast tier only, per DESIGN.md section 22.5: under 2 min, no single test
      # over ~20 s. The durations report is the early warning when that slips.
      - name: Run fast tests
        run: make test

  # The slow tier runs once rather than across the whole matrix; it is the gate a
  # milestone PR has to clear, not a per-version compatibility check.
  pytest-full:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Gmsh runtime library
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run full suite
        run: make test-full
